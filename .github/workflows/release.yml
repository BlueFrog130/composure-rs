name: Release

# Releases are driven by change files in .changeset/ (see CONTRIBUTING.md):
# - every push to main with pending change files opens or updates the release PR
#   (knope bumps the version of each crate a change file names and writes its CHANGELOG.md)
# - when a crate's version on main has no `<crate>/v<version>` tag (the release PR was merged),
#   that crate is published to crates.io, then knope tags it and creates its GitHub release
#
# Secrets: CARGO_REGISTRY_TOKEN (crates.io token with publish-new and publish-update scopes).
# Optional: RELEASE_TOKEN, a token with contents and pull-requests write access, so the release PR
# triggers CI (pull requests opened with the default GITHUB_TOKEN do not).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  KNOPE_VERSION: 0.23.1

jobs:
  prepare-release:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Look for change files
        id: changes
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change files: nothing to release"
          fi
      - name: Configure Git
        if: steps.changes.outputs.pending == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: knope-dev/action@v2.1.2
        if: steps.changes.outputs.pending == 'true'
        with:
          version: ${{ env.KNOPE_VERSION }}
      - name: Prepare the release PR
        if: steps.changes.outputs.pending == 'true'
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

  release:
    name: Publish and tag
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Which crates are unreleased?
        id: unreleased
        # `crate@version` in dependency order, for every crate knope hasn't tagged at its version
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          crates=""
          for crate in composure_macros composure composure_commands composure_sync composure_adapter_cloudflare composure_adapter_tokio cargo-composure; do
            version=$(jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<< "$metadata")
            if git rev-parse --verify --quiet "refs/tags/$crate/v$version" > /dev/null; then
              echo "$crate $version is already released"
            else
              echo "Releasing $crate $version"
              crates="$crates $crate@$version"
            fi
          done
          echo "crates=${crates# }" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.unreleased.outputs.crates != ''
      - uses: Swatinem/rust-cache@v2
        if: steps.unreleased.outputs.crates != ''
      - name: Publish to crates.io
        if: steps.unreleased.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES: ${{ steps.unreleased.outputs.crates }}
        # Versions already on crates.io are skipped, so a failed run can be re-run. `cargo publish`
        # waits for each crate to be in the index before the next.
        run: |
          for release in $CRATES; do
            crate=${release%@*}
            version=${release#*@}
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "composure-release (github.com/BlueFrog130/composure-rs)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already published"
            else
              cargo publish -p "$crate"
            fi
          done
      - uses: knope-dev/action@v2.1.2
        if: steps.unreleased.outputs.crates != ''
        with:
          version: ${{ env.KNOPE_VERSION }}
      - name: Tag and create the GitHub releases
        if: steps.unreleased.outputs.crates != ''
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
