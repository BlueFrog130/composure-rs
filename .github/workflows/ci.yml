name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages and builds each published crate as crates.io would, in dependency order
      - run: cargo publish --workspace --dry-run

  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-src: const-panic errors in the trybuild expectations quote core's source
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # Live Discord API tests (composure_sync) are #[ignore]d; no secrets needed.
      - run: cargo test --workspace

  docs:
    name: Docs (as docs.rs builds them)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and missing docs fail the build; the guide's (book/) examples run
      # as doctests in `check`
      - run: cargo doc --no-deps --all-features -p composure -p composure_macros -p composure_commands -p composure_sync -p composure_adapter_cloudflare -p composure_adapter_tokio
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  wasm:
    name: Cloudflare adapter (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p composure_adapter_cloudflare -p composure_example_cloudflare -p composure_bench_cloudflare --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p composure_bench_cloudflare --target wasm32-unknown-unknown --features web-crypto -- -D warnings
      - run: cargo build -p composure_adapter_cloudflare -p composure_example_cloudflare --target wasm32-unknown-unknown --release

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p composure -p composure_macros -p composure_commands -p composure_sync --all-features

  msrv-adapter:
    name: MSRV adapters (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p composure_adapter_cloudflare -p composure_example_cloudflare -p composure_bench_cloudflare --target wasm32-unknown-unknown
      - run: cargo check -p composure_adapter_tokio
