name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # Live Discord API tests in composure_api are #[ignore]d; no secrets needed.
      - run: cargo test --workspace

  wasm:
    name: Cloudflare adapter (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p composure_adapter_cloudflare --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p composure_adapter_cloudflare --target wasm32-unknown-unknown --release

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p composure -p composure_commands -p composure_api

  msrv-adapter:
    name: MSRV Cloudflare adapter (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p composure_adapter_cloudflare --target wasm32-unknown-unknown

  live:
    name: Live Discord API
    needs: check
    # Secrets are unavailable to fork PRs
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Runs share one bot, guild, and global command list
    concurrency:
      group: discord-live
      cancel-in-progress: false
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live regression
        if: env.DISCORD_TOKEN != ''
        run: cargo test -p composure_api --test regression -- --ignored --test-threads=1 --nocapture
      - name: Skipped (secrets not configured)
        if: env.DISCORD_TOKEN == ''
        run: echo "::warning::DISCORD_TOKEN / DISCORD_APPLICATION_ID / DISCORD_GUILD_ID secrets not set; live tests skipped"
