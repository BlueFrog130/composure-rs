[package]
name = "composure_example_cloudflare"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "Regression bot for the Composure Cloudflare adapter"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
composure = { path = "../../../" }
composure_adapter_cloudflare = { path = "../" }
worker = "0.8.7"

[dev-dependencies]
ed25519-dalek = "3.0.0"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde_json = "1.0.154"
