[package]
name = "composure_example_commands"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "Example Composure bot on Cloudflare Workers using #[command]"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
composure = { path = "../../../", features = ["macros"] }
composure_adapter_cloudflare = { path = "../" }
worker = "0.8.7"

# Sync runs on the host only; keeps the HTTP client out of the worker bundle
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
composure_api = { path = "../../../api" }
dotenvy = "0.15.7"

[dev-dependencies]
ed25519-dalek = "3.0.0"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
hex = "0.4.3"
serde_json = "1.0.154"
