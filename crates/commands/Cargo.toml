[package]
name = "composure_commands"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Builder for Discord application command definitions, for Composure bots not using its macros"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discord", "bot", "slash-commands", "interactions", "builder"]
categories = ["api-bindings"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
composure = { path = "../composure", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
