[package]
name = "cargo-composure"
# Bumped by knope from .changeset/ (see knope.toml)
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "`cargo composure dev`: tunnel, endpoint and guild Commands kept up to date while you work on a Composure Discord bot"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discord", "bot", "cli", "tunnel", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[dependencies]
composure = { workspace = true, features = ["rest-application"] }
composure_adapter_tokio.workspace = true
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
notify = "8.2.0"
reqwest = "0.13.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.17"

[dev-dependencies]
composure = { path = "../composure", features = ["testing"] }
tokio = { version = "1.53.3", features = ["test-util"] }
