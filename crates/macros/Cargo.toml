[package]
name = "composure_macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for Composure Discord bots: #[command], #[app], #[view] and rsx! markup"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discord", "bot", "macros", "slash-commands", "jsx"]
categories = ["api-bindings", "development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
rstml = { version = "0.13.1", default-features = false }
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
composure = { path = "../composure", features = ["macros"] }
futures = { version = "0.3.34", default-features = false, features = [
	"executor",
] }
serde_json = "1.0.154"
trybuild = "1"
serde = { version = "1.0.229", features = ["derive"] }
