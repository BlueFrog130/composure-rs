[package]
name = "composure_macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Command macros for Composure"
repository = "https://github.com/BlueFrog130/composure-rs"
keywords = ["discord", "bot", "edge", "serverless", "wasm"]
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
composure = { path = "../composure", features = ["macros"] }
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
serde_json = "1.0.154"
trybuild = "1"
