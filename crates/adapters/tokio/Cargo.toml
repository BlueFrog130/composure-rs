[package]
name = "composure_adapter_tokio"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "Serve Composure Discord bots from a hosted server on tokio and hyper, with graceful shutdown and health checks"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discord", "bot", "tokio", "server", "interactions"]
categories = ["web-programming::http-server", "asynchronous", "api-bindings"]

[dependencies]
composure = { path = "../../composure", version = "0.1.0", features = [
	"rest",
	"tracing",
] }
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = [
	"executor",
] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful"] }
reqwest = "0.13.5"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["net", "rt", "signal", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
composure = { path = "../../composure", features = ["macros"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
