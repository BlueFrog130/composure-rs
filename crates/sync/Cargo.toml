[package]
name = "composure_sync"
# Bumped by knope from .changeset/ (see knope.toml)
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Deploy-time CLI that syncs a Composure bot's slash commands with Discord: plan, confirm, apply, CI drift checks"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discord", "bot", "slash-commands", "deploy", "cli"]
categories = ["command-line-utilities", "api-bindings", "development-tools"]

[dependencies]
composure = { workspace = true, features = ["rest-commands", "reqwest"] }
pollster = "0.4.0"
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"], optional = true }
cliclack = { version = "0.5.6", optional = true }
console = { version = "0.16.6", optional = true }

[features]
default = ["cli"]
## `sync_from_env`: the interactive / CI Sync command line (clap + cliclack)
cli = ["dep:clap", "dep:cliclack", "dep:console"]

[dev-dependencies]
composure_commands.workspace = true
dotenvy = "0.15.7"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
