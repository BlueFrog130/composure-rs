[package]
name = "composure_sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Sync a Composure App's command definitions with Discord"
repository = "https://github.com/BlueFrog130/composure-rs/sync"
keywords = ["discord", "bot", "edge", "serverless", "wasm"]
license = "Apache-2.0"

[dependencies]
composure = { path = "../composure", version = "0.1.0", features = ["rest-commands", "reqwest"] }
pollster = "0.4.0"
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"], optional = true }
cliclack = { version = "0.5.6", optional = true }
console = { version = "0.16.6", optional = true }

[features]
default = ["cli"]
## `sync_from_env`: the interactive / CI Sync command line (clap + cliclack)
cli = ["dep:clap", "dep:cliclack", "dep:console"]

[dev-dependencies]
composure_commands = { path = "../commands", version = "0.1.0" }
dotenvy = "0.15.7"
