[package]
name = "composure_example_tokio"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "The example Composure bot on a hosted server with tokio"
license = "Apache-2.0"
publish = false

# Unique across the workspace: both examples have a sync bin
[[bin]]
name = "sync-tokio"
path = "src/bin/sync.rs"

[dependencies]
composure = { path = "../../crates/composure", features = ["macros"] }
composure_adapter_tokio = { path = "../../crates/adapters/tokio" }
composure_example_bot = { path = "../bot", features = ["tokio"] }
composure_sync = { path = "../../crates/sync" }
dotenvy = "0.15.7"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
composure = { path = "../../crates/composure" }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
reqwest = "0.13.5"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync"] }
