[package]
name = "composure_example_bot"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "The example Composure bot's shared commands, served by the Cloudflare and tokio examples"
license.workspace = true
publish = false

[dependencies]
composure = { workspace = true, features = ["macros", "tier1"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
hex = "0.4.3"
serde_json = "1.0.154"
