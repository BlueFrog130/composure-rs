[package]
name = "composure_example_cloudflare"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "The example Composure bot on Cloudflare Workers"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Unique across the workspace: both examples have a sync bin
[[bin]]
name = "sync-cloudflare"
path = "src/bin/sync.rs"

[dependencies]
composure = { workspace = true, features = ["macros"] }
composure_adapter_cloudflare = { workspace = true, features = ["tracing"] }
composure_example_bot = { path = "../bot" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
worker = "0.8.7"

# Sync runs on the host only; keeps the HTTP client out of the worker bundle
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
composure_sync.workspace = true
dotenvy = "0.15.7"

[dev-dependencies]
serde_json = "1.0.154"

# worker-build's wasm-opt step (default `-O`). Workers compile each function on its first call,
# and binaryen inlines every function with one caller, merging the bot into a few huge functions
# the first request compiles whole; not inlining those makes the first request ~20% and warm
# requests ~30% faster, and the gzip 10% smaller. Names: see .cargo/config.toml. Measured by
# crates/adapters/cloudflare/bench/tests/coldstart.rs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--one-caller-inline-max-function-size", "0"]
