[package]
name = "composure_example_cloudflare"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
description = "The example Composure bot on Cloudflare Workers"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Unique across the workspace: both examples have a sync bin
[[bin]]
name = "sync-cloudflare"
path = "src/bin/sync.rs"

[dependencies]
composure = { path = "../../crates/composure", features = ["macros"] }
composure_adapter_cloudflare = { path = "../../crates/adapters/cloudflare", features = ["tracing"] }
composure_example_bot = { path = "../bot", features = ["cloudflare"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
worker = "0.8.7"

# Sync runs on the host only; keeps the HTTP client out of the worker bundle
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
composure_sync = { path = "../../crates/sync" }
dotenvy = "0.15.7"

[dev-dependencies]
serde_json = "1.0.154"
