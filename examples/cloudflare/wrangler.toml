name = "composure-commands-example"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# DISCORD_PUBLIC_KEY (required) and DISCORD_TOKEN (for REST commands) are secrets:
# `npx wrangler secret put <NAME>`, or `.env` for `wrangler dev`

# worker-build compiles the crate to wasm and writes the JS shim to build/worker
[build]
command = "worker-build --release"

# GREETING becomes the Bot Data /greet reads (`with_data` in src/lib.rs)
[vars]
GREETING = "Hello"
# Needed by bot_client() outside Interactions (the cron trigger below)
DISCORD_APPLICATION_ID = ""
# STATUS_CHANNEL_ID = "<channel id>" enables the daily heartbeat

# /note keeps notes here: `npx wrangler kv namespace create NOTES`, then paste the id.
# `wrangler dev` simulates it locally whatever the id.
[[kv_namespaces]]
binding = "NOTES"
id = "<NOTES namespace id>"

# Workers Logs: stores and indexes what the tracing subscriber logs (see src/lib.rs start)
[observability]
enabled = true

# Runs the scheduled() handler daily at 09:00 UTC
[triggers]
crons = ["0 9 * * *"]
