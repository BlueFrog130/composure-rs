[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
composure = { version = "0.2", features = ["macros"] }
composure_adapter_cloudflare = "0.2"
worker = "0.8.7"

# Sync runs on your machine or in CI, never in the Worker: keeps its HTTP client out of the bundle
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
composure_sync = "0.2"
dotenvy = "0.15.7"

[dev-dependencies]
composure = { version = "0.2", features = ["testing"] }

# Workers bill and cold-start by bundle size
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

# Workers compile each wasm function on its first call: not inlining single-caller functions
# keeps the first request from compiling the whole bot at once
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--one-caller-inline-max-function-size", "0"]

# `cargo composure dev`: your development application and test server. Neither id is a secret
[package.metadata.composure.dev]
application = "{{application}}"
guild = "{{guild}}"
