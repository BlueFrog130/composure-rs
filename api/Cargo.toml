[package]
name = "composure_api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Discord bot framework for running on the edge"
repository = "https://github.com/BlueFrog130/composure-rs/api"
keywords = ["discord", "bot", "edge", "serverless", "wasm"]
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
composure = { path = "../", version = "0.1.0" }
composure_commands = { path = "../commands", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
dotenvy = "0.15.7"

