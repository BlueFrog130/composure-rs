[workspace]
resolver = "3"
members = [
    "crates/composure",
    "crates/macros",
    "crates/commands",
    "crates/api",
    "crates/adapters/cloudflare",
    "crates/adapters/cloudflare/bench",
    "examples/cloudflare",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"
