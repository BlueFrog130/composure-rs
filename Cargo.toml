[workspace]
resolver = "3"
members = [
    "crates/composure",
    "crates/macros",
    "crates/commands",
    "crates/sync",
    "crates/adapters/cloudflare",
    "crates/adapters/cloudflare/bench",
    "crates/adapters/tokio",
    "examples/bot",
    "examples/cloudflare",
    "examples/tokio",
    "bots/composure",
]
# cargo-generate templates: `{{project-name}}` placeholders, checked by scripts/check-templates.sh
exclude = ["templates"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BlueFrog130/composure-rs"
homepage = "https://github.com/BlueFrog130/composure-rs"

# The published crates, as they depend on each other; each `version` is bumped by knope with that
# crate's own (see knope.toml)
[workspace.dependencies]
composure = { path = "crates/composure", version = "0.1.3" }
composure_macros = { path = "crates/macros", version = "0.1.3" }
composure_commands = { path = "crates/commands", version = "0.1.3" }
composure_sync = { path = "crates/sync", version = "0.1.3" }
composure_adapter_cloudflare = { path = "crates/adapters/cloudflare", version = "0.1.3" }
composure_adapter_tokio = { path = "crates/adapters/tokio", version = "0.1.3" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"

# Signature checking without `web-crypto`: on workerd a 1 KB verify takes ~132 us at "z", ~103 us
# at 3, for ~15 KB of bundle (bench/). Parsing stays at "z": "s"/3 save a few us for 75-180 KB.
[profile.release.package.curve25519-dalek]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
